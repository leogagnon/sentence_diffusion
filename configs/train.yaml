defaults:
  - train_config
  - _self_
  - task/ae: null
  - task/diffusion: null
  - model_checkpoint: null
 
seed: 42
log_dir: /network/scratch/l/leo.gagnon/sentence_diffusion/logs
max_epochs: 200
accumulate_grad_batches: 8
val_check_interval: 250

hydra:
  run:
    dir: ${log_dir}/hydra/${now:%Y-%m-%d}_${now:%H-%M-%S}

logger:
  _target_: lightning.pytorch.loggers.WandbLogger
  entity: guillaume-lajoie
  project: sentence_diffusion
  save_dir: ${log_dir}
  offline: False
  tags: null
  resume: allow
  #name: ${task.name}_${now:%Y-%m-%d}_${now:%H-%M-%S}  
