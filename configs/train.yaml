defaults:
  - train_config
  - _self_
  - task: base
  - model_checkpoint: null
  - hydra/sweeper/params : null
  - override hydra/launcher: base
 
seed: 42
log_dir: /network/scratch/l/leo.gagnon/sentence_diffusion/logs
max_epochs: 200
accumulate_grad_batches: 64
val_check_interval: 250

hydra:
  run:
    dir: ${log_dir}/hydra/${now:%Y-%m-%d}_${now:%H-%M-%S}
  sweep:
    dir: ${log_dir}/hydra_multiruns/${sweep_id}
    subdir: ${hydra.job.num}

logger:
  _target_: lightning.pytorch.loggers.WandbLogger
  entity: guillaume-lajoie
  project: sentence_diffusion
  save_dir: ${log_dir}
  offline: False
  tags: null
  resume: allow  
