task/ae: base
model_checkpoint: base
effective_batch_size: 1024
task.ae.batch_size: 32
task.ae.lr_warmup_steps: 1000
task.ae.lr: 3e-5
task/ae/dataset: fineweb, fineweb_long
task/ae/encoder/sem: flat_bigL, flat_bigL_
task.ae.encoder.sem.dropout_p: 0.0
task.ae.sem_noise: 0.3
task.ae.decoder.name: gpt2-large
task.ae.sem_noise_warmup_steps: 10000
