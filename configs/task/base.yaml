train_batch_size: 32
val_batch_size: 512
lr: 2e-4

variational: False
input_sub_p: 0.3
kl_beta: 5e-6
max_generation_length: 150
val_size: 512

encoder:
  name: bert-large-uncased # 336M params
  k: 16
  lora_cfg: 
    r: 64
    lora_alpha: 16
    target_modules: ["query", "value", "dense"]
    lora_dropout: 0.1
    bias: "none"

decoder:
  name: gpt2-large # 774M params
  lora_cfg: 
    r: 64
    lora_alpha: 16
    target_modules: ["c_attn", "c_proj"]
    lora_dropout: 0.1
    bias: "none"

dataset:
  path: data/