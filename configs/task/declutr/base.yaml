batch_size: 32
lr: 5e-5
lr_warmup_steps: 2000

encoder:
  model_name: FacebookAI/roberta-large
  train_backbone: true
  latent_length: 1
  latent_dim: 1024
  mlp_proj: true
  sem: 
    _target_: model.encoder.SEMHead
    L: 512
    V: 16
    temp: 1.0
    
dataset:
  name: fineweb
  val_size: 16384
  seed: 42

min_span_length: 32
max_span_length: 256
num_anchors: 2
num_positives: 2
loss_temp: 0.05
sem_noise: 0.05

name: base/declutr
