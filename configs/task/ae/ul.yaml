lr: 5e-5
lr_warmup_steps: 2000
batch_size: 64

dataset:
  name: fineweb
  val_size: 16384
  seed: 42

encoder:
  model_name: SONAR
  train_backbone: true
  latent_length: 1
  mlp_proj: false
  no_out_proj: true

decoder:
  name: gpt2-medium
  cross_attention: false
  attn_implem: sdpa

prefix_length: 16
suffix_length: 64
context_length: 112

# Noise: prior_logsnr_max defines t_min (match stage-2 value)
# noise_schedule=true samples t ~ Uniform[t_min, 1.0] each step
prior_logsnr_max: 5.0
noise_schedule: false
train_schedule: cosine
auto_scale_schedule: true
finetune_encoder: true
encoder_lr: 1e-5
train_schedule_tau: 5.0

soft_prompt_len: 16
noise_cond: false  # condition soft_thought_enc on noise level (useful with noise_schedule=true)
latent_feature_dropout_prob: 0.00
latent_conditioning_dropout_prob: 0.0

name: ae/ul
