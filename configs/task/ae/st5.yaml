train_batch_size: 16
val_batch_size: 64
lr: 1e-4
max_generation_length: 100
val_size: 512
z_noise_type: schedule

encoder:
  _target_: model.encoder.SentenceT5Encoder
  name: sentence-transformers/sentence-t5-large # 1.5B params

decoder:
  name: gpt2-large # 1.5B params
  prompt_generator_cfg:
    n_layers: 6
    n_heads: 12
    k: 8
    noise_conditioning: true
    default_alpha: 0.95  # delta^2=0.05 like in DGLM
  lora_cfg: 
    r: 128
    lora_alpha: 32
    target_modules: ["c_attn", "mlp.c_fc", "mlp.c_proj"]
    lora_dropout: 0.1
    bias: "none"
    
dataset:
  path: data/

name: st5

