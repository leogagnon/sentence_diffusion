batch_size: 16
lr: 1e-4
max_generation_length: 150
val_size: 16384
z_noise_type: fixed
z_noise_alpha: 1.0
z_dropout_p: 0.0

encoder:
  _target_: model.encoder.STEncoder
  name: SONAR # 0.6B params
  normalize: false
  lora_cfg: 
    r: 128
    lora_alpha: 32
    target_modules: ["k_proj", "v_proj", "out_proj", "fc1", "fc2"]
    lora_dropout: 0.1
    bias: "none"
  sem_cfg:
    L: 128
    V: 512
    temp: 1.0
  dropout_p: 0.3

decoder:
  name: gpt2-large # 1.5B params
  prompt_generator_cfg:
    n_layers: 6
    n_heads: 12
    k: 8
  lora_cfg: 
    r: 128
    lora_alpha: 32
    target_modules: ["c_attn", "c_fc", "c_proj"]
    lora_dropout: 0.1
    bias: "none"

name: dae_sem_sonar

defaults:
  - dataset: wiki
