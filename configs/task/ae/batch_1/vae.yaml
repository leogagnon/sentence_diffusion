batch_size: 16
lr: 1e-4
max_generation_length: 150
val_size: 16384
z_noise_type: variational
kl_beta: 1e-5

encoder:
  _target_: model.encoder.STEncoder
  name: Qwen/Qwen3-Embedding-0.6B # 0.6B params
  normalize: false
  lora_cfg: 
    r: 128
    lora_alpha: 32
    target_modules: ["o_proj", "down_proj", "v_proj", "up_proj", "gate_proj", "k_proj"]
    lora_dropout: 0.1
    bias: "none"
  dropout_p: 0.3
  variational: true

decoder:
  name: gpt2-large # 1.5B params
  prompt_generator_cfg:
    n_layers: 6
    n_heads: 12
    k: 8
  lora_cfg: 
    r: 128
    lora_alpha: 32
    target_modules: ["c_attn", "c_fc", "c_proj"]
    lora_dropout: 0.1
    bias: "none"

name: vae

defaults:
  - dataset: wiki
