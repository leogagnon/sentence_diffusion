batch_size: 32
lr: 1e-4
lr_warmup_steps: 1000
val_size: 16384
delta_ent: 0.0
reg_warmup_steps: 10000
sem_noise: 0.3
sem_noise_warmup_steps: 10000
prefix_length: 32
suffix_length: 128
denoising: true

encoder:
  model_name: SONAR

decoder:
  name: gpt2-large # 1.5B params
  cross_attention: True

dataset:
  _target_: data.datasets.FineWebDataset

name: base_ae

defaults:
  - encoder/sem: flat
