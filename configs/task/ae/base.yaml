batch_size: 32
lr: 1e-4
lr_warmup_steps: 500
sem_noise: 0.3
sem_noise_warmup_steps: 0
prefix_length: 16
suffix_length: 64
context_length: 0
dataset: fineweb
denoising: true
encoder_mode: suffix

encoder:
  model_name: SONAR
  train_backbone: True
  latent_length: 32

decoder:
  name: gpt2-large # 1.5B params
  cross_attention: True

name: base_ae

defaults:
  - encoder/sem: flat
