batch_size: 64
lr: 5e-4
lr_warmup_steps: 2000
sem_noise: 0.0
sem_noise_warmup_steps: 0
prefix_length: 16
suffix_length: 64
context_length: 112
denoising: true
encoder_mode: context

dataset:
  name: fineweb
  val_size: 16384
  seed: 42

encoder:
  model_name: FacebookAI/roberta-large
  train_backbone: true
  latent_length: 32

decoder:
  name: gpt2-medium # 1.5B params
  cross_attention: True
  attn_implem: sdpa

name: ae/cont
