batch_size: 16
lr: 5e-4
lr_warmup_steps: 2000
loss_temp: 0.05
max_length: 128
dataset_seed: 42

encoder:
  model_name: FacebookAI/roberta-large
  train_backbone: true
  latent_length: 1
  latent_dim: 1024
  mlp_proj: true

declutr_dataset:
  name: fineweb
  val_size: 16384
  seed: 42

declutr_min_span_length: 32
declutr_max_span_length: 512
declutr_num_anchors: 2
declutr_num_positives: 2
