  sem:
    _target_: model.encoder.SEMHead
    L: 64
    V: 64
    temp: 0.5
    dirichlet_eta: 0.00
    l2_norm: False

teacher:
  name: SONAR # 1.5B params

name: base_dcse

dataset:
  _target_: data.datasets.WikipediaDataset
  max_length: 128
