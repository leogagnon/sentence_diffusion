batch_size: 64
lr: 5e-4
lr_warmup_steps: 2000

encoder:
  model_name: FacebookAI/roberta-large
  train_backbone: true
  latent_length: 1
  latent_dim: 1024
  mlp_proj: true
  sem:
    _target_: model.encoder.SEMHead
    L: 512
    V: 16
    temp: 0.5

dataset:
  name: fineweb
  val_size: 16384
  seed: 42

span_length: 64
loss_temp: 0.05
sem_noise: 0.05

name: simcse/sem
